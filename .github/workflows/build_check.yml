name: Build Debug APK
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build app
        run: ./gradlew assembleDebug

      - name: Prepare APKs
        run: |
          mv app/build/outputs/apk/debug/app-arm64-v8a-debug.apk TachiyomiSY-arm64-v8a.apk
          mv app/build/outputs/apk/debug/app-universal-debug.apk TachiyomiSY-universal.apk

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.13.2-oled-preview
          name: "TachiyomiSY OLED Build Preview"
          body: |
            ### 📱 Download Langsung File APK:
            * **TachiyomiSY-arm64-v8a.apk** (Rekomendasi untuk semua HP Android modern)
            * **TachiyomiSY-universal.apk** (Versi kompatibel semua prosesor)
          files: |
            TachiyomiSY-arm64-v8a.apk
            TachiyomiSY-universal.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
